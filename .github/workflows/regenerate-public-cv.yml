name: Regenerate public CV

on:
  push:
    branches: [main]
    paths:
      - data/public-profile.json
      - scripts/generate_public_cv.py
      - .github/workflows/regenerate-public-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/generate_public_cv.py
      - name: Commit generated CV outputs
        run: |
          if [ -z "$(git status --porcelain -- cv/index.html assets/Olivier-Dreyer-CV.pdf)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/index.html assets/Olivier-Dreyer-CV.pdf
          git commit -m "Regenerate public CV"
          git push
